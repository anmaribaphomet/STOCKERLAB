<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCKERLAB - LABS</title>
    <link rel="stylesheet" href="materiales.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!--Libreria para las alertas-->
    <!-- Iconos -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <header class="navbar">
        <h1 class="logo">STOCKERLAB</h1>
        <div id="status-server" class="server-status-box">
            <span class="status-dot"></span>
            <span id="status-text" class="status-text">Conectando...</span>
        </div>
        <button class="btn-caja"><i data-lucide="user"></i> <span id="txt-usuario-header">Usuario</span></button>
    </header>

    <main class="container">
        <nav class="tabs">
            <button class="tab active" id="btn-nav-materiales"><i data-lucide="book-open"></i> Materiales</button>
            <button class="tab" id="btn-nav-bitacora"><i data-lucide="folder"></i> Bitácora de Materiales</button>
            <button class="tab" id="btn-nav-incidencias"><i data-lucide="bookmark"></i> Incidencias</button>
        </nav>

        <div class="contenedor-principal">
            <section class="material-header">
                <h2 class="section-title">Materiales</h2>
                <div class="search-bar">
                    <select id="tipo-filtro">
                        <option value="id" class="opciones-header">ID</option>
                        <option value="nombre" class="opciones-header">Nombre</option>
                        <option value="cantidad" class="opciones-header">Cantidad</option>
                    </select>
                    <input type="text" id="input-busqueda" placeholder="Busqueda">
                    <button class="btn-search" id="btn-search-material"><i data-lucide="search"></i></button>
                </div>
            </section>

            <!-- Contenedor de la cuadrícula -->
            <div class="material-grid" id="material-container">
                <!-- La primera tarjeta siempre es la de "Agregar" -->
                <div class="card-add" id="btn-abrir-modal-add">
                    <div class=" inner-add">
                        <i data-lucide="book-plus"></i>
                    </div>
                    <span style="margin-top: 20px; font-weight: bold;">Agregar</span>
                </div>
                <!-- material4es cargados de la API -->
            </div>
        </div>

        <div id="Form-materiales" class="form-overlay">

            <!--Formulario para crear materiales o editar materiales-->

        </div>
    </main>
    <footer class="bottom-bar">
        <button id="btn-cerrar-sesion" class="btn-exit" title="Cerrar Sesión">
            <i data-lucide="log-out" class="exit-icon"></i>
        </button>
    </footer>

    <script src="materiales.js"></script>
</body>

</html>
