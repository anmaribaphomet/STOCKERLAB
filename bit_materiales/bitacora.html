<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidencias</title>
    <link rel="stylesheet" href="bitacora.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!--Libreria para las alertas-->
</head>

<body>
    <!--SECCION DE MENU-->
    <header class="navbar">
        <h1 class="logo">STOCKERLAB <span id="nombre-lab-dinamico" class="lab-subtitulo">...</span></h1>
        <div id="status-server" class="server-status-box">
            <span class="status-dot"></span>
            <span id="status-text" class="status-text">Conectando...</span>
        </div>
        <button class="btn-caja"><i data-lucide="user"></i> <span id="txt-usuario-header">Usuario</span></button>
    </header>

    <nav class="tabs">
        <button class="tab" id="btn-nav-materiales"><i data-lucide="book-open"></i> Materiales</button>
        <button class="tab active" id="btn-nav-bitacora"><i data-lucide="folder"></i> Bitácora de Materiales</button>
        <button class="tab" id="btn-nav-incidencias"><i data-lucide="bookmark"></i> Incidencias</button>
    </nav>

    <!--SECCION PARA INCIDENCIAS-->
    <div class="contenedor-principal">
        <main class="container">

            </button>
            <!-- Menú de navegación de Incidencias -->
            <div class="contenedor-botones">
                <h1 style="margin-top: 2%; margin-left: 120px;">BITÁCORA DE MATERIALES</h1>

            </div>

            <div class="buscador-bitacoras">

                <select id="tipo-filtro">
                    <option value="id">ID</option>
                    <option value="Profesor">Profesor</option>

                </select>

                <input type="text" id="input-busqueda" placeholder="Buscar">

                <button id="btn-buscar-filtro">
                    <i data-lucide="search"></i>
                </button>
            </div>
            <div class="content-bitacoras-p">
                <input type="button" id="btnagregar" class="btns" data-lucide="plus" onclick="mapForm('agregar')">

                <div id="contenedor-bitacoras">


                    <!--INSERTAR LAS CARDS DE BITACORAS-->

                </div>
            </div>

            <div id="Form-bitacoras" class="form-overlay">

            </div>
        </main>

    </div>
    <footer class="bottom-bar">
        <button id="btn-cerrar-sesion" class="btn-exit" title="Cerrar Sesión">
            <i data-lucide="log-out" class="exit-icon"></i>
        </button>
    </footer>
    <script src="bitacora.js"></script>


</body>

</html>
